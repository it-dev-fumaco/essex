services:
  app:
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=${APP_URL:-${ESSEX_APP_URL:-http://essex.local:8080}}
      - ASSET_URL=${ASSET_URL:-${ESSEX_ASSET_URL:-http://essex.local:8080}}
    volumes:
      # Dev: mount local code (writable for Laravel)
      - ./:/var/www/html
      # Dev: revalidate PHP files immediately (no rebuild needed for code edits)
      - ./docker/php/opcache.dev.ini:/usr/local/etc/php/conf.d/zz-opcache-dev.ini:ro

  nginx:
    volumes:
      # Dev: serve current public/ (Mix/Vite output) without rebuilding the nginx image
      - ./public:/var/www/html/public:ro
