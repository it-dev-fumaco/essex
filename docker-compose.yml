# Essex: PHP-FPM + nginx + Redis (cache/queue/session) on app_network. No external stack required.
# Usage:
#   docker compose up -d --build
# HTTP: host ${ESSEX_HTTP_PORT:-8080} -> nginx :80. Set APP_URL/ASSET_URL to match (e.g. http://essex.local:8080).

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: essex-app:latest
    container_name: essex-app
    restart: unless-stopped
    command: ["php-fpm"]
    expose:
      - "9000"
    volumes:
      - storage_public:/var/www/html/storage/app/public
      - storage_logs:/var/www/html/storage/logs
    environment:
      - APP_ENV=production
      - APP_URL=${APP_URL:-${ESSEX_APP_URL:-http://essex.local:8080}}
      - ASSET_URL=${ASSET_URL:-${ESSEX_ASSET_URL:-http://essex.local:8080}}
      - HTTPS=false
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_CLIENT=phpredis
      - CACHE_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "/usr/local/bin/php-fpm-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: essex-nginx:latest
    container_name: essex-nginx
    restart: unless-stopped
    ports:
      - "${ESSEX_HTTP_PORT:-8080}:80"
    volumes:
      - storage_public:/var/www/html/storage/app/public:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    container_name: essex-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    volumes:
      - essex_redis:/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  storage_public:
    driver: local
  storage_logs:
    driver: local
  essex_redis:
    driver: local

networks:
  app_network:
    driver: bridge
